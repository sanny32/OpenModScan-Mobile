name: omodscan_mobile
description: "Mobile version of Modbus Master (Client) Utility OpenModScan"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.0
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.5
  modbus_client: ^1.4.5
  modbus_client_tcp: ^1.2.3
  logging: ^1.3.0
  go_router: ^17.2.3
  share_plus: ^13.1.0
  file_selector: ^1.1.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  plugin_platform_interface: ^2.1.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
  remove_alpha_ios: false

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icon/
